<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioSystem Pro - Control de Asistencia en Vivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col p-4 sm:p-6 lg:p-8">

    <div class="max-w-7xl w-full mx-auto space-y-6 flex-1 flex flex-col">
        
        <!-- ENCABEZADO -->
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-red-400 flex items-center justify-center text-white shadow-lg shadow-rose-500/20">
                    <i class="bi bi-qr-code-scan text-xl"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="text-xl font-bold text-white">Punto de Control Biométrico</h1>
                        <span class="flex items-center space-x-1.5 bg-rose-500/10 text-rose-400 border border-rose-500/20 text-[10px] font-semibold px-2.5 py-0.5 rounded-full">
                            <span class="w-1.5 h-1.5 rounded-full bg-rose-400 animate-pulse"></span>
                            <span>EN VIVO</span>
                        </span>
                    </div>
                    <p class="text-xs text-slate-400">Reconocimiento facial automático de asistencias</p>
                </div>
            </div>
            
            <a href="/dashboard" class="text-slate-400 hover:text-white text-xs bg-slate-800/80 border border-slate-700/80 px-4 py-2 rounded-xl transition-all flex items-center space-x-2">
                <i class="bi bi-arrow-left"></i>
                <span>Volver al Dashboard</span>
            </a>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1">
            
            <!-- VIDEO FEED (2 COLS) -->
            <div class="lg:col-span-2 glass-card rounded-2xl p-4 sm:p-6 flex flex-col justify-between">
                <div class="relative rounded-xl overflow-hidden bg-black border border-slate-800 shadow-2xl flex-1 flex items-center justify-center min-h-[450px]">
                    <img src="{{ url_for('video_feed', modo='reconocimiento') }}" class="w-full h-full object-contain">
                </div>
                <div class="mt-4 flex items-center justify-between text-xs text-slate-400 px-1">
                    <span class="flex items-center space-x-1.5">
                        <i class="bi bi-shield-lock-fill text-indigo-400"></i>
                        <span>Sistema IA Activo - Alta precisión</span>
                    </span>
                    <span>Cámara integrada ROG Strix</span>
                </div>
            </div>

            <!-- HISTORIAL DE HOY LATERAL (1 COL) -->
            <div class="glass-card rounded-2xl p-6 flex flex-col">
                <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
                    <div class="flex items-center space-x-2">
                        <i class="bi bi-clock-history text-indigo-400"></i>
                        <h3 class="font-bold text-white text-base">Asistencias de Hoy</h3>
                    </div>
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                </div>

                <div class="space-y-3 flex-1 overflow-y-auto max-h-[500px]" id="lista-asistencias">
                    <div class="text-center text-slate-500 py-12 space-y-2">
                        <div class="inline-block w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                        <p class="text-xs">Esperando registros de asistencia...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function actualizarAsistencias() {
            fetch('/api/ultimas_asistencias')
                .then(response => response.json())
                .then(data => {
                    const lista = document.getElementById('lista-asistencias');
                    if (data.length === 0) {
                        lista.innerHTML = `
                            <div class="text-center text-slate-500 py-12">
                                <i class="bi bi-person-bounding-box text-3xl opacity-40 mb-2 block"></i>
                                <p class="text-xs">Nadie ha marcado asistencia hoy todavía</p>
                            </div>`;
                        return;
                    }
                    
                    let html = '';
                    data.forEach(registro => {
                        html += `
                            <div class="p-3 rounded-xl bg-slate-800/40 border border-slate-800/80 flex items-center justify-between hover:border-slate-700 transition-all">
                                <div class="flex items-center space-x-3">
                                    <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center text-sm">
                                        <i class="bi bi-check-lg"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs font-bold text-slate-200">${registro.nombre}</p>
                                        <p class="text-[10px] text-slate-500">Acceso biométrico verificado</p>
                                    </div>
                                </div>
                                <span class="text-xs font-semibold bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 px-2.5 py-1 rounded-lg">
                                    ${registro.hora}
                                </span>
                            </div>
                        `;
                    });
                    lista.innerHTML = html;
                })
                .catch(err => console.error("Error cargando asistencias:", err));
        }

        setInterval(actualizarAsistencias, 2000);
        actualizarAsistencias();
    </script>

<!-- Socket.IO Client CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const socket = io();

    // Escuchar asistencias en tiempo real
    socket.on('nueva_asistencia', function(data) {
        const lista = document.getElementById('lista-asistencias');
        // Agregar de manera instantánea el registro arriba de la lista
        const nuevoItem = `
            <div class="p-3 rounded-xl bg-slate-800/40 border border-slate-800/80 flex items-center justify-between animate-pulse">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center text-sm">
                        <i class="bi bi-check-lg"></i>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-slate-200">${data.nombre}</p>
                        <p class="text-[10px] text-slate-500">Acceso verificado vía WebSocket</p>
                    </div>
                </div>
                <span class="text-xs font-semibold bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 px-2.5 py-1 rounded-lg">
                    ${data.hora}
                </span>
            </div>
        `;
        lista.insertAdjacentHTML('afterbegin', nuevoItem);
    });
</script>

</body>
</html>
