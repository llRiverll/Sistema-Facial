<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioSystem Pro - Acceso Biométrico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .scanner-line {
            background: linear-gradient(180deg, rgba(99, 102, 241, 0) 0%, rgba(99, 102, 241, 0.6) 50%, rgba(99, 102, 241, 1) 100%);
            animation: scan 2.5s infinite ease-in-out;
        }
        @keyframes scan {
            0% { top: -10%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-4xl w-full glass-card rounded-3xl overflow-hidden shadow-2xl grid grid-cols-1 md:grid-cols-12 border border-slate-800/80 relative z-10">
        
        <div class="md:col-span-7 bg-black relative flex items-center justify-center min-h-[380px] md:min-h-[480px] overflow-hidden group">
            <img src="{{ url_for('video_feed', modo='login') }}" class="w-full h-full object-cover">
            
            <div class="absolute inset-0 pointer-events-none border-2 border-indigo-500/20 m-4 rounded-2xl flex flex-col justify-between p-4">
                <div class="flex justify-between items-start">
                    <div class="w-6 h-6 border-t-2 border-l-2 border-indigo-500"></div>
                    <div class="w-6 h-6 border-t-2 border-r-2 border-indigo-500"></div>
                </div>
                <div class="absolute left-0 right-0 h-12 scanner-line pointer-events-none"></div>
                <div class="flex justify-between items-end">
                    <div class="w-6 h-6 border-b-2 border-l-2 border-indigo-500"></div>
                    <div class="w-6 h-6 border-b-2 border-r-2 border-indigo-500"></div>
                </div>
            </div>

            <div class="absolute top-6 left-6 bg-slate-950/80 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-slate-800 text-xs font-semibold text-slate-200 flex items-center space-x-2">
                <div class="w-2 h-2 rounded-full bg-indigo-400 animate-ping"></div>
                <span>IA RECONOCIMIENTO ACTIVO</span>
            </div>
        </div>

        <div class="md:col-span-5 p-8 flex flex-col justify-between space-y-6 bg-slate-900/60 backdrop-blur-md">
            
            <div class="space-y-2">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
                        <i class="bi bi-cpu-fill text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-extrabold text-white tracking-tight">BioSystem <span class="text-indigo-400 text-xs px-2 py-0.5 rounded-full bg-indigo-500/10 border border-indigo-500/20">v5.0</span></h1>
                        <p class="text-[11px] text-slate-400">Control Biométrico Inteligente</p>
                    </div>
                </div>
            </div>

            <div id="mensaje_estado" class="p-4 rounded-2xl bg-slate-800/50 border border-slate-700/60 transition-all duration-300">
                <div class="flex items-center space-x-3 text-slate-300">
                    <div class="relative flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-indigo-500"></span>
                    </div>
                    <span class="text-xs font-medium">Escaneando rostro en tiempo real...</span>
                </div>
            </div>

            <!-- FORMULARIO AJAX PARA EVITAR ERRORES DE CARGA INFINITA -->
            <div class="space-y-4 pt-4 border-t border-slate-800">
                <p class="text-xs text-slate-400 font-medium">Acceso alternativo por clave:</p>
                
                <div id="mensaje_error_pass" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs items-center space-x-2">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span id="texto_error_pass">Contraseña incorrecta</span>
                </div>

                <form id="form_login_pass" class="space-y-3">
                    <div class="relative">
                        <i class="bi bi-key-fill absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                        <input type="password" id="input_password" name="password" required placeholder="Contraseña maestra" class="w-full bg-slate-950/80 border border-slate-700/80 text-slate-100 text-xs rounded-xl pl-10 pr-4 py-2.5 focus:outline-none focus:border-indigo-500 transition-all placeholder:text-slate-600">
                    </div>
                    <button type="submit" id="btn_entrar_pass" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg shadow-indigo-600/20 text-xs transition-all flex items-center justify-center space-x-2">
                        <span>Ingresar como Admin</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </form>
            </div>

            <div class="text-center pt-2">
                <p class="text-[10px] text-slate-500">ROG Strix Optimized Engine &bull; OpenCV LBPH</p>
            </div>

        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();

        socket.on('login_exitoso', function(data) {
            const estadoDiv = document.getElementById('mensaje_estado');
            
            if (data.es_admin === 1) {
                estadoDiv.className = "p-4 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 shadow-lg shadow-emerald-500/10";
                estadoDiv.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-lg bg-emerald-500/20 flex items-center justify-center text-emerald-400 text-base">
                            <i class="bi bi-shield-check"></i>
                        </div>
                        <div>
                            <p class="text-xs font-bold">¡Bienvenido Admin ${data.nombre}!</p>
                            <p class="text-[10px] text-emerald-400/80">Redirigiendo al Dashboard...</p>
                        </div>
                    </div>`;
                setTimeout(() => window.location.href = "/dashboard", 1200);
            } else {
                estadoDiv.className = "p-4 rounded-2xl bg-indigo-500/10 border border-indigo-500/30 text-indigo-300 shadow-lg shadow-indigo-500/10";
                estadoDiv.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center text-indigo-400 text-base">
                            <i class="bi bi-check-circle-fill"></i>
                        </div>
                        <div>
                            <p class="text-xs font-bold">Asistencia Marcada</p>
                            <p class="text-[10px] text-indigo-300">${data.nombre} a las ${data.hora}</p>
                        </div>
                    </div>`;
                setTimeout(() => {
                    estadoDiv.className = "p-4 rounded-2xl bg-slate-800/50 border border-slate-700/60 transition-all duration-300";
                    estadoDiv.innerHTML = `
                        <div class="flex items-center space-x-3 text-slate-300">
                            <div class="relative flex h-3 w-3">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-3 w-3 bg-indigo-500"></span>
                            </div>
                            <span class="text-xs font-medium">Escaneando rostro en tiempo real...</span>
                        </div>`;
                }, 4000);
            }
        });

        document.getElementById('form_login_pass').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const pass = document.getElementById('input_password').value;
            const btn = document.getElementById('btn_entrar_pass');
            const errDiv = document.getElementById('mensaje_error_pass');
            const errTexto = document.getElementById('texto_error_pass');

            btn.disabled = true;
            btn.innerHTML = '<span>Verificando...</span>';
            errDiv.classList.add('hidden');
            errDiv.classList.remove('flex');

            fetch('/do_login_password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'ok') {
                    btn.innerHTML = '<span>¡Acceso Concedido!</span>';
                    window.location.href = data.redirect;
                } else {
                    errTexto.textContent = data.message || 'Contraseña incorrecta.';
                    errDiv.classList.remove('hidden');
                    errDiv.classList.add('flex');
                    btn.disabled = false;
                    btn.innerHTML = '<span>Ingresar como Admin</span><i class="bi bi-arrow-right"></i>';
                }
            })
            .catch(err => {
                console.error(err);
                errTexto.textContent = 'Error de conexión con el servidor.';
                errDiv.classList.remove('hidden');
                errDiv.classList.add('flex');
                btn.disabled = false;
                btn.innerHTML = '<span>Ingresar como Admin</span><i class="bi bi-arrow-right"></i>';
            });
        });
    </script>
</body>
</html>
