<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioSystem Pro - Registro Multi-Shot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full mx-auto space-y-6">
        
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-lg shadow-emerald-500/20">
                    <i class="bi bi-camera2 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white">Registro Multi-Shot (IA)</h1>
                    <p class="text-xs text-slate-400">Captura automática de ráfaga para alta precisión</p>
                </div>
            </div>
            <a href="/dashboard" class="text-slate-400 hover:text-white text-xs bg-slate-800/80 border border-slate-700/80 px-3.5 py-2 rounded-xl transition-all flex items-center space-x-1.5">
                <i class="bi bi-arrow-left"></i>
                <span>Volver</span>
            </a>
        </div>

        <div class="glass-card rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
            
            <div class="relative rounded-xl overflow-hidden bg-black border border-slate-800 shadow-inner aspect-video flex items-center justify-center">
                <img id="vista_camara" src="{{ url_for('video_feed', modo='registro') }}" class="w-full h-full object-cover">
                <canvas id="canvas_foto" class="w-full h-full object-cover" style="display: none;"></canvas>
                
                <!-- Overlay de cuenta regresiva -->
                <div id="overlay_contador" class="absolute inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center text-5xl font-extrabold text-indigo-400" style="display: none;">
                    3
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label for="nombre" class="block text-xs font-medium text-slate-300 mb-1.5">Nombre Completo</label>
                    <input type="text" id="nombre" required placeholder="Ej. Arturo Rivera Morales" class="w-full bg-slate-900/90 border border-slate-700 text-slate-100 text-sm rounded-xl px-4 py-2.5 focus:outline-none focus:border-indigo-500 transition-all">
                </div>

                {% if session.admin_logged_in %}
                <div class="flex items-center space-x-3 bg-slate-900/50 p-3.5 rounded-xl border border-slate-800">
                    <input type="checkbox" id="es_admin" class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-indigo-500">
                    <label for="es_admin" class="text-xs font-medium text-slate-300 cursor-pointer">Otorgar privilegios de Administrador</label>
                </div>
                {% endif %}

                <button type="button" id="btn_capturar" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg shadow-amber-500/25 transition-all flex items-center justify-center space-x-2">
                    <i class="bi bi-lightning-charge-fill text-lg"></i>
                    <span>INICIAR RÁFAGA BIOMÉTRICA (10 FOTOS)</span>
                </button>
            </div>

        </div>
    </div>

    <script>
        const vista = document.getElementById('vista_camara');
        const canvas = document.getElementById('canvas_foto');
        const btnCap = document.getElementById('btn_capturar');
        const contadorDiv = document.getElementById('overlay_contador');
        let fotosCapturadas = [];

        btnCap.addEventListener('click', async () => {
            const nombre = document.getElementById('nombre').value.trim();
            if (!nombre) {
                alert('Por favor ingresa el nombre completo primero.');
                document.getElementById('nombre').focus();
                return;
            }

            btnCap.disabled = true;
            contadorDiv.style.display = 'flex';
            
            // Cuenta regresiva 3, 2, 1
            for (let i = 3; i > 0; i--) {
                contadorDiv.textContent = i;
                await new Promise(r => setTimeout(r, 1000));
            }

            contadorDiv.textContent = "¡CAPTURA!";
            fotosCapturadas = [];

            // Tomar 10 fotos en ráfaga cada 200ms
            for (let i = 0; i < 10; i++) {
                canvas.width = vista.naturalWidth || 640;
                canvas.height = vista.naturalHeight || 480;
                canvas.getContext('2d').drawImage(vista, 0, 0, canvas.width, canvas.height);
                fotosCapturadas.push(canvas.toDataURL('image/jpeg', 0.90));
                await new Promise(r => setTimeout(r, 200));
            }

            contadorDiv.textContent = "¡GUARDANDO...";

            const esAdmin = document.getElementById('es_admin') ? document.getElementById('es_admin').checked : false;

            // Enviar por JSON al backend
            fetch('/guardar_usuario_multishot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre: nombre, es_admin: esAdmin, fotos: fotosCapturadas })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    window.location.href = '/dashboard';
                } else {
                    alert('Error: ' + data.message);
                    btnCap.disabled = false;
                    contadorDiv.style.display = 'none';
                }
            })
            .catch(err => {
                console.error(err);
                alert('Error de red al guardar.');
                btnCap.disabled = false;
                contadorDiv.style.display = 'none';
            });
        });
    </script>
</body>
</html>
